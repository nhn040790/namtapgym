<title>Nhật ký PT</title>
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone app over a sunny gym backdrop (iron plate + "NO PAIN NO GAIN" outline) with a chibi mascot; 5-tab bottom bar. Single bright look by choice. */
:root{
  --bg:#FFF4EC; --card:rgba(255,255,255,.90); --card-solid:#FFFFFF; --raise:rgba(60,30,40,.055); --line:rgba(60,30,40,.11);
  --ink:#1F1A24; --muted:#6E6470; --red:#E5322D; --orange:#FF6A13; --green:#14A86B; --gold:#C98A00; --steel:#B9AEB3;
  --display:"Oswald","Arial Narrow",Impact,system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(120% 55% at 100% 0%,rgba(255,106,19,.32),transparent 60%),radial-gradient(90% 45% at 0% 35%,rgba(255,196,60,.30),transparent 65%),radial-gradient(100% 50% at 15% 100%,rgba(229,50,45,.16),transparent 62%),radial-gradient(70% 40% at 100% 70%,rgba(64,190,255,.14),transparent 60%),linear-gradient(180deg,#FFF8F1 0%,#FFF1E6 60%,#FFEADB 100%)}
.bgfx svg{position:absolute}
.bgfx .plate{width:min(620px,140vw);right:-28%;top:-12%;opacity:.13;animation:spin 120s linear infinite}
.bgfx .words{left:-4%;bottom:6%;width:min(760px,150vw);opacity:.09}
.bgfx .grain{inset:0;width:100%;height:100%;opacity:.10;mix-blend-mode:overlay}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bgfx .plate{animation:none}}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 112px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--display);text-transform:uppercase;letter-spacing:.5px}
h1{font-size:30px;font-weight:700;line-height:1.05}
h2{font-size:19px;font-weight:600}
h3{font-size:15px;font-weight:600}
.sub{color:var(--muted);font-size:13.5px}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.card{box-shadow:0 2px 14px rgba(120,50,30,.07);background:var(--card);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}}
.stat{box-shadow:0 2px 14px rgba(120,50,30,.07);background:var(--card);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font-family:var(--display);font-size:28px;font-weight:700;line-height:1}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:4px;background:var(--raise);color:var(--muted);white-space:nowrap}
.chip.good{background:rgba(61,214,140,.14);color:var(--green)}
.chip.hot{background:rgba(229,50,45,.18);color:#D42A25}
.chip.warn{background:rgba(255,122,26,.16);color:var(--orange)}
.chip.gold{background:rgba(245,197,66,.16);color:var(--gold)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--ink);color:#fff;font-size:14.5px;text-transform:uppercase;letter-spacing:.6px;font-family:var(--display)}
.btn.hot{background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;box-shadow:0 4px 14px rgba(229,50,45,.28)}
.btn.ghost{background:var(--raise);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:13px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45}
.link{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 6px;border-radius:6px}
.link.danger{color:#D42A25;font-weight:600}
.link.acc{color:var(--orange);font-weight:600}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.banner{position:relative;overflow:hidden;border-radius:var(--r);padding:18px 16px 16px;background:linear-gradient(135deg,#FF4A3D,#E5322D 45%,#FF6A13);border:1px solid rgba(255,255,255,.2);display:flex;flex-direction:column;gap:6px}
.banner::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:repeating-linear-gradient(-45deg,#111 0 10px,var(--orange) 10px 20px);opacity:.9}
.banner .slogan{font-family:var(--display);font-weight:700;font-size:46px;line-height:.92;letter-spacing:1px;text-transform:uppercase;color:#fff}
.banner .slogan span{color:#111}
.banner .quote{font-size:15px;font-weight:600;color:#FFE9DE;padding-bottom:8px}
.banner{padding-right:128px;min-height:176px}
.banner .chibi{position:absolute;right:2px;bottom:6px;width:128px;height:auto;filter:drop-shadow(0 6px 10px rgba(80,10,0,.35))}
@media (prefers-reduced-motion:no-preference){.banner .chibi{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}}
.mini{width:84px;height:auto;flex:none}
.banner .day{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:#FFD3C2;font-weight:700}
.big{font-family:var(--display);font-size:66px;font-weight:700;line-height:.9}
.big small{font-size:24px;font-weight:500;margin-left:4px;color:var(--muted)}
.ruler{height:46px;margin-top:2px;color:var(--ink)}
.ruler svg{width:100%;height:100%;display:block;overflow:visible}
.meta{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);gap:8px;flex-wrap:wrap}
.meta b{color:var(--ink)}
.eta{border-top:1px solid var(--line);padding-top:10px;font-size:13.5px;color:var(--muted)}
.eta b{color:var(--ink)}
.chart svg{display:block;width:100%;height:auto}
.go{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid rgba(255,122,26,.5);background:linear-gradient(160deg,rgba(255,106,19,.20),rgba(255,255,255,.94) 60%);box-shadow:0 2px 14px rgba(120,50,30,.08);padding:16px;display:flex;flex-direction:column;gap:12px}
.go .cta{font-family:var(--display);font-size:38px;font-weight:700;line-height:1;text-transform:uppercase;letter-spacing:1px}
.go .cd{font-family:var(--display);font-size:20px;color:var(--orange);font-weight:600}
.go.done{border-color:rgba(61,214,140,.45);background:linear-gradient(160deg,rgba(20,168,107,.18),rgba(255,255,255,.94) 60%)}
.go.done .cd{color:var(--green)}
.checks{display:flex;flex-direction:column}
.check{display:flex;align-items:center;gap:10px;padding:8px 2px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.check:first-child{border-top:0}
.check .box{flex:none;width:22px;height:22px;border-radius:5px;border:2px solid var(--steel);display:flex;align-items:center;justify-content:center}
.check[aria-pressed="true"] .box{background:var(--red);border-color:var(--red)}
.check[aria-pressed="true"] .t{text-decoration:line-through;color:var(--muted)}
.check .t{flex:1;min-width:0;font-weight:600}
.check .s{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dow,.month{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.8px}
.mday{position:relative;aspect-ratio:1/1.08;max-width:100%;border-radius:8px;border:1px solid var(--line);background:var(--raise);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;min-width:0}
.mday .n{font-family:var(--display);font-size:17px;font-weight:600;line-height:1}
.mday .tag{font-size:9.5px;font-weight:700;letter-spacing:.5px;color:var(--muted);line-height:1}
.mday.plan{border:1.5px dashed rgba(255,122,26,.75)}
.mday.plan .tag{color:var(--orange)}
.mday.miss{border:1.5px dashed rgba(229,50,45,.8);background:rgba(229,50,45,.06)}
.mday.miss .tag{color:#D42A25}
.mday.done{background:linear-gradient(135deg,var(--red),#B51F1B);border:1px solid rgba(255,255,255,.18)}
.mday.done .n{color:#fff}
.mday.done .tick{width:18px;height:18px}
.mday.today{box-shadow:0 0 0 2px var(--ink)}
.mday.sel{outline:2px solid var(--orange);outline-offset:2px}
.mday.future{opacity:.75}
.mday .cam{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.mday .pr{position:absolute;top:2px;left:3px;font-size:8.5px;font-weight:800;color:#FFE27A}
.blank{aspect-ratio:1/1.08}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.progress{height:8px;border-radius:2px;background:var(--raise);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--orange))}
.progress.green i{background:var(--green)}
.progress.over i{background:#D42A25}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
.item:first-child{border-top:0;padding-top:2px}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item .title{font-weight:600}
.item .note{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.exl{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.exl span{color:var(--muted)}
.badge{flex:none;width:48px;height:48px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);line-height:1;background:var(--raise);overflow:hidden;border:0;padding:0}
.badge b{font-size:18px}
.badge i{font-style:normal;font-size:10.5px;color:var(--muted);font-family:var(--body)}
.badge img{width:100%;height:100%;object-fit:cover}
.acts{display:flex;flex-direction:column;align-items:flex-end}
.empty{color:var(--muted);font-size:14px;padding:4px 0}
table.t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;text-align:right;padding:4px 6px}
table.t th:first-child,table.t td:first-child{text-align:left;padding-left:0}
table.t td{padding:8px 6px;border-top:1px solid var(--line);text-align:right}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.shot{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:8px;overflow:hidden;background:var(--raise);border:0;padding:0}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-size:11.5px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));text-align:left;font-variant-numeric:tabular-nums}
.full{width:100%;border-radius:10px;display:block}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.compare figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.compare img{width:100%;aspect-ratio:3/4;max-width:100%;object-fit:cover;border-radius:8px;background:var(--raise)}
.compare figcaption{font-size:12.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.compare figcaption b{display:block;font-family:var(--display);font-size:20px;color:var(--ink)}
.habit{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.habit:first-of-type{border-top:0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--raise);font-size:18px;line-height:1}
.stepper output{min-width:62px;text-align:center;font-weight:600}
.bar{height:6px;border-radius:2px;background:var(--raise);overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--orange))}
.kcal{display:flex;align-items:baseline;gap:6px}
.kcal b{font-family:var(--display);font-size:44px;line-height:1}
.meal{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.meal:first-child{border-top:0;padding-top:0}
.food{display:flex;justify-content:space-between;gap:10px;font-size:14px;align-items:center}
.food .fn{min-width:0;overflow-wrap:anywhere}
.food .fk{color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.picker button{text-align:left;border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.picker button b{font-size:13.5px;font-weight:600}
.picker button span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.medals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:380px){.medals{grid-template-columns:repeat(3,1fr)}}
.medal{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:none;border:0;padding:0;min-width:0}
.medal svg{width:58px;height:64px}
.medal span{font-size:11px;line-height:1.25;color:var(--muted)}
.medal.on span{color:var(--ink);font-weight:600}
.medal.big svg{width:110px;height:122px}
.ex{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.02)}
.ex .hint{font-size:12.5px;color:var(--muted)}
.ex .hint:empty{display:none}
.setrow{display:grid;grid-template-columns:44px 1fr 1fr 30px;gap:6px;align-items:center}
.setrow span{font-size:12px;color:var(--muted);font-weight:600}
.setrow input{padding:8px 10px;text-align:center}
.setrow button{background:none;border:0;color:var(--muted);font-size:18px;padding:0}
form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:13px;font-weight:600;color:var(--muted)}
input,textarea,select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0;font-size:16px}
select option{background:#fff}
textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--raise);border-radius:6px;padding:6px 12px;font-size:13.5px}
.chips button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.upload{display:flex;gap:12px;align-items:center;border:1.5px dashed var(--line);border-radius:10px;padding:10px}
.upload .pv{width:72px;height:96px;border-radius:8px;background:var(--raise);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.upload .pv img{width:100%;height:100%;object-fit:cover}
.upload input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.upload label.btn{display:inline-block}
details.more summary{cursor:pointer;color:var(--orange);font-weight:600;font-size:14px}
details.more[open] summary{margin-bottom:10px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card-solid);border-top:1px solid var(--line);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92%;overflow-y:auto;padding-top:18px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
.poster{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.poster .top{position:relative;background:linear-gradient(135deg,var(--red),#8E1614);padding:16px 16px 22px}
.poster .top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:repeating-linear-gradient(-45deg,#111 0 10px,var(--orange) 10px 20px)}
.poster .top .m{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;color:#fff;text-transform:uppercase}
.poster .top .k{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#FFD3C2;font-weight:700}
.poster .stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.poster .stats div{background:#FFF6EF;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.poster .stats b{font-family:var(--display);font-size:30px;line-height:1}
.poster .foot{padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.poster img{width:100%;max-height:340px;object-fit:cover;display:block}
.timer{position:fixed;left:0;right:0;top:0;z-index:70;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(255,255,255,.97);box-shadow:0 4px 18px rgba(0,0,0,.12);border-bottom:2px solid var(--orange);display:flex;align-items:center;gap:12px;justify-content:space-between}
.timer .tt{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.timer .tl{font-size:11.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:700}
.timer.end{background:var(--red);border-color:#fff}
.timer.end .tl,.timer.end .tt{color:#fff}
@media (prefers-reduced-motion:no-preference){.timer.end{animation:flash .5s steps(2) 6}@keyframes flash{50%{background:var(--orange)}}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);box-shadow:0 -2px 14px rgba(120,50,30,.08);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;min-width:0}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--orange)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;font-weight:600;padding:9px 16px;border-radius:8px;font-size:13.5px;z-index:80;max-width:calc(100% - 32px);text-align:center}
.note-box{font-size:12.5px;color:var(--muted)}
.ro{background:rgba(245,197,66,.16);border:1px solid rgba(245,197,66,.4);color:var(--gold);border-radius:8px;padding:10px 12px;font-size:13.5px;font-weight:600}
.ptnote{font-size:13px;background:rgba(61,214,140,.10);border-left:3px solid var(--green);padding:6px 8px;border-radius:4px;overflow-wrap:anywhere}
.ptnote b{color:var(--green)}
.pain{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.pain:first-child{border-top:0;padding-top:0}
.lvl{flex:none;width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;font-weight:700;color:#fff}
.alert{display:flex;gap:8px;align-items:center;background:rgba(229,50,45,.16);border:1px solid rgba(229,50,45,.45);border-radius:8px;padding:8px 10px;font-size:13.5px}
.share{display:flex;flex-direction:column;gap:8px;counter-reset:st}
.share li{list-style:none;display:flex;gap:10px;font-size:14px}
.share li::before{counter-increment:st;content:counter(st);flex:none;width:22px;height:22px;border-radius:50%;background:var(--orange);color:#1B1C24;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.share{padding:0;margin:0}
/* weight progress */
.exchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.exchips button{flex:none;border:1px solid var(--line);background:var(--raise);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap}
.exchips button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#1B1C24;font-weight:700}
.gain{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gain div{background:var(--raise);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.gain b{font-family:var(--display);font-size:24px;line-height:1}
/* PT package punch card */
.pkgno{font-family:var(--display);font-size:44px;font-weight:700;line-height:1;text-transform:uppercase}
.pkgno b{color:var(--orange)}
.pkgno span{color:var(--muted);font-size:26px}
.pkgpct{font-family:var(--display);font-size:28px;font-weight:700;line-height:1}
.punches{display:grid;gap:4px}
.punch{aspect-ratio:1;max-width:100%;border-radius:4px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--steel);font-variant-numeric:tabular-nums}
.punch.on{background:linear-gradient(135deg,var(--red),#B51F1B);border-color:transparent;color:#fff}
.punch.now{box-shadow:0 0 0 2px var(--orange);background:var(--orange)}
.mday .sn{font-size:9px;font-weight:700;color:#FFD3C2;line-height:1}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:90;pointer-events:none}
</style>
